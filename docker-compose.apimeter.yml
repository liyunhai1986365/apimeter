name: apimeter-api

services:
  apimeter-api:
    image: ${APIMETER_API_IMAGE:-wagjie/apimeter-api:latest}
    container_name: apimeter-api
    restart: unless-stopped
    command: --log-dir /data/logs
    ports:
      - "${APIMETER_API_PORT:-3000}:3000"
    volumes:
      - apimeter_data:/data
    environment:
      SYSTEM_NAME: APIMeter API
      SQLITE_PATH: /data/apimeter-api.db
      SESSION_SECRET: ${SESSION_SECRET:?Create .env from .env.apimeter.example and set SESSION_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
      GIN_MODE: release
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  apimeter_data:
    name: apimeter-api-data

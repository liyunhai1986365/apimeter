name: modelsell-api

services:
  modelsell-api:
    image: ${MODELSELL_API_IMAGE:-wagjie/modelsell-api:latest}
    container_name: modelsell-api
    restart: unless-stopped
    command: --log-dir /data/logs
    ports:
      - "${MODELSELL_API_PORT:-3000}:3000"
    volumes:
      - modelsell_data:/data
    environment:
      SYSTEM_NAME: Modelsell API
      SQLITE_PATH: /data/modelsell-api.db
      SESSION_SECRET: ${SESSION_SECRET:?Create .env from .env.modelsell.example and set SESSION_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
      GIN_MODE: release
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  modelsell_data:
    name: modelsell-api-data

name: apimeter-api

services:
  apimeter-api:
    image: ${APIMETER_API_IMAGE:-wagjie/apimeter-api:apimeter-2026.08.05}
    container_name: apimeter-api
    restart: unless-stopped
    command: --log-dir /data/logs
    ports:
      - "${APIMETER_BIND_IP:-127.0.0.1}:${APIMETER_API_PORT:-3000}:3000"
    volumes:
      - apimeter_app_data:/data
    environment:
      SYSTEM_NAME: APIMeter API
      SQL_DSN: ${SQL_DSN:?Set SQL_DSN to the existing MySQL database in .env}
      LOG_SQL_DSN: ${LOG_SQL_DSN:-}
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?Set CRYPTO_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
      GIN_MODE: release
      NODE_TYPE: master
      NODE_NAME: ${NODE_NAME:-apimeter-docker-1}
      SQL_MAX_OPEN_CONNS: ${SQL_MAX_OPEN_CONNS:-100}
      SQL_MAX_IDLE_CONNS: ${SQL_MAX_IDLE_CONNS:-25}
      SQL_MAX_LIFETIME: ${SQL_MAX_LIFETIME:-60}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-20}
      MEMORY_CACHE_ENABLED: ${MEMORY_CACHE_ENABLED:-true}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      SYNC_FREQUENCY: ${SYNC_FREQUENCY:-60}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      BATCH_UPDATE_INTERVAL: ${BATCH_UPDATE_INTERVAL:-5}
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - apimeter

  redis:
    image: redis:7.4-alpine
    container_name: apimeter-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - apimeter_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - apimeter

volumes:
  apimeter_app_data:
    name: apimeter-api-app-data
  apimeter_redis_data:
    name: apimeter-api-redis-data

networks:
  apimeter:
    name: apimeter-api-network
    driver: bridge

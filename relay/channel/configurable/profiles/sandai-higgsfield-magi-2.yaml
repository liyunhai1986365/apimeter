id: sandai-higgsfield-magi-2
family: SandAI
name: Higgsfield · MAGI-2
media_type: video
accepted_modes: [openai.video.generations]
upstream_modes: [higgsfield.sand.magi-2]
video:
  submit:
    method: POST
    path: /sand/magi-2/text-to-video
    path_variants:
      - path: /sand/magi-2/image-to-video
        field: request.mode
        equals: image-to-video
      - path: /sand/magi-2/reference-to-video
        field: request.mode
        equals: reference-to-video
    headers: &auth
      - name: Authorization
        value: 'Key {api_key}'
    body:
      fields:
        - {to: duration, from: request.duration}
        - {to: prompt, from: request.prompt, omit_empty: true}
        - {to: image_url, from: request.metadata.image_url, omit_empty: true}
        - {to: end_image_url, from: request.metadata.end_image_url, omit_empty: true}
        - {to: image_urls, from: request.metadata.image_urls, omit_empty: true}
        - {to: video_urls, from: request.metadata.video_urls, omit_empty: true}
        - {to: audio_urls, from: request.metadata.audio_urls, omit_empty: true}
        - {to: resolution, from: request.metadata.resolution, omit_empty: true}
        - {to: aspect_ratio, from: request.metadata.aspect_ratio, omit_empty: true}
        - {to: seed, from: request.metadata.seed, omit_null: true}
        - {to: generate_audio, from: request.metadata.generate_audio, omit_null: true}
    response:
      task_id_path: request_id
      status_path: status
  fetch:
    method: GET
    path: /requests/{task_id}/status
    headers: *auth
    response:
      task_id_path: request_id
      status_path: status
      result_url_path: video.url
      reason_path: error
      status_map:
        queued: QUEUED
        in_progress: IN_PROGRESS
        completed: SUCCESS
        failed: FAILURE
        nsfw: FAILURE
        canceled: FAILURE

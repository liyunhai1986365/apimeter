id: kling-video
name: Kling Video
media_type: video
accepted_modes:
  - openai.video.generations
upstream_modes:
  - kling.video
video:
  billing:
    ratios:
      - key: seconds
        from: request.duration
        default: 5
      - key: size
        value: 1
  submit:
    method: POST
    path: /v1/videos/text2video
    headers:
      - name: Authorization
        value: Bearer {kling_jwt}
        transform: kling_jwt
    path_variants:
      - path: /image-to-video/kling-3.0-turbo
        field: request.metadata.kling_capability
        equals: turbo-image
      - path: /text-to-video/kling-3.0-turbo
        field: request.metadata.kling_capability
        equals: turbo-text
      - path: /v1/videos/image2video
        field: request.image
        non_empty: true
      - path: /v1/videos/omni-video
        field: request.metadata.kling_capability
        equals: omni-video
      - path: /v1/videos/motion-control
        field: request.metadata.kling_capability
        equals: motion-control
      - path: /v1/videos/multi-image2video
        field: request.metadata.kling_capability
        equals: multi-image2video
      - path: /v1/videos/multi-elements
        field: request.metadata.kling_capability
        equals: multi-elements
      - path: /v1/videos/video-extend
        field: request.metadata.kling_capability
        equals: video-extend
      - path: /v1/videos/advanced-lip-sync
        field: request.metadata.kling_capability
        equals: advanced-lip-sync
      - path: /v1/videos/avatar/image2video
        field: request.metadata.kling_capability
        equals: avatar-image2video
      - path: /v1/audio/text-to-audio
        field: request.metadata.kling_capability
        equals: text-to-audio
      - path: /v1/audio/video-to-audio
        field: request.metadata.kling_capability
        equals: video-to-audio
    body:
      fields:
        - to: model_name
          from: upstream_model
          when_model_contains: kling-v
          omit_empty: true
        - to: model_name
          from: upstream_model
          when_model_contains: kling-o
          omit_empty: true
        - to: prompt
          from: request.prompt
          omit_empty: true
        - to: contents
          from: request.metadata.contents
          append: true
          omit_empty: true
        - to: contents.0.type
          value: prompt
          when_model_contains: kling-3.0-turbo
        - to: contents.0.text
          from: request.prompt
          when_model_contains: kling-3.0-turbo
        - to: contents.1.type
          value: first_frame
          when_model_contains: kling-3.0-turbo
        - to: contents.1.url
          from: request.image
          when_model_contains: kling-3.0-turbo
          omit_empty: true
        - to: settings.resolution
          from: request.size
          when_model_contains: kling-3.0-turbo
          omit_empty: true
        - to: settings.duration
          from: request.seconds
          fallback_from: request.duration
          transform: to_int
          when_model_contains: kling-3.0-turbo
          omit_empty: true
        - to: settings
          from: request.metadata.settings
          omit_empty: true
        - to: options.callback_url
          from: request.metadata.callback_url
          when_model_contains: kling-3.0-turbo
          omit_empty: true
        - to: options.external_task_id
          from: request.metadata.external_task_id
          when_model_contains: kling-3.0-turbo
          omit_empty: true
        - to: options.watermark_info
          from: request.metadata.watermark_info
          when_model_contains: kling-3.0-turbo
          omit_empty: true
        - to: negative_prompt
          from: request.metadata.negative_prompt
          omit_empty: true
        - to: cfg_scale
          from: request.metadata.cfg_scale
          omit_empty: true
        - to: mode
          from: request.metadata.mode
          fallback_from: request.size
          omit_empty: true
        - to: duration
          from: request.seconds
          fallback_from: request.duration
          transform: to_int
          omit_empty: true
        - to: aspect_ratio
          from: request.metadata.aspect_ratio
          fallback_from: request.metadata.ratio
          omit_empty: true
        - to: image
          from: request.image
          fallback_from: request.images.0
          omit_empty: true
        - to: image_tail
          from: request.metadata.image_tail
          omit_empty: true
        - to: static_mask
          from: request.metadata.static_mask
          omit_empty: true
        - to: dynamic_masks
          from: request.metadata.dynamic_masks
          omit_empty: true
        - to: camera_control
          from: request.metadata.camera_control
          omit_empty: true
        - to: callback_url
          from: request.metadata.callback_url
          omit_empty: true
        - to: external_task_id
          from: request.metadata.external_task_id
          omit_empty: true
        - to: images
          from: request.images
          omit_empty: true
        - to: video
          from: request.metadata.video
          fallback_from: request.metadata.video_url
          omit_empty: true
        - to: video_id
          from: request.metadata.video_id
          omit_empty: true
        - to: audio
          from: request.metadata.audio
          fallback_from: request.metadata.audio_url
          omit_empty: true
        - to: face_id
          from: request.metadata.face_id
          omit_empty: true
        - to: selection_id
          from: request.metadata.selection_id
          omit_empty: true
        - to: trajectory
          from: request.metadata.trajectory
          omit_empty: true
    response:
      task_id_path: data.task_id
      status_path: data.task_status
      status_map:
        submitted: SUBMITTED
        pending: QUEUED
        queued: QUEUED
        processing: IN_PROGRESS
        running: IN_PROGRESS
        succeed: SUCCESS
        succeeded: SUCCESS
        success: SUCCESS
        completed: SUCCESS
        failed: FAILURE
        failure: FAILURE
        error: FAILURE
  fetch:
    method: GET
    path: /v1/videos/text2video/{task_id}
    headers:
      - name: Authorization
        value: Bearer {kling_jwt}
        transform: kling_jwt
    path_variants:
      - path: /tasks
        field: kling_capability
        equals: turbo
      - path: /v1/videos/image2video/{task_id}
        field: action
        equals: generate
      - path: /v1/videos/omni-video/{task_id}
        field: kling_capability
        equals: omni-video
      - path: /v1/videos/motion-control/{task_id}
        field: kling_capability
        equals: motion-control
      - path: /v1/videos/multi-image2video/{task_id}
        field: kling_capability
        equals: multi-image2video
      - path: /v1/videos/multi-elements/{task_id}
        field: kling_capability
        equals: multi-elements
      - path: /v1/videos/video-extend/{task_id}
        field: kling_capability
        equals: video-extend
      - path: /v1/videos/advanced-lip-sync/{task_id}
        field: kling_capability
        equals: advanced-lip-sync
      - path: /v1/videos/avatar/image2video/{task_id}
        field: kling_capability
        equals: avatar-image2video
      - path: /v1/audio/text-to-audio/{task_id}
        field: kling_capability
        equals: text-to-audio
      - path: /v1/audio/video-to-audio/{task_id}
        field: kling_capability
        equals: video-to-audio
    response:
      task_id_path: data.task_id
      status_path: data.task_status
      progress_path: data.task_status_msg
      result_url_path: data.task_result.videos.0.url
      reason_path: data.task_status_msg
      status_map:
        submitted: SUBMITTED
        pending: QUEUED
        queued: QUEUED
        processing: IN_PROGRESS
        running: IN_PROGRESS
        succeed: SUCCESS
        succeeded: SUCCESS
        success: SUCCESS
        completed: SUCCESS
        failed: FAILURE
        failure: FAILURE
        error: FAILURE
    openai_response:
      fields:
        - to: video_url
          from: data.task_result.videos.0.url
          omit_empty: true
        - to: metadata.url
          from: data.task_result.videos.0.url
          omit_empty: true
        - to: metadata.watermarked_url
          from: data.task_result.videos.0.watermarked_url
          omit_empty: true
resources:
  - id: turbo_text2video_create
    name: Kling 3.0 Turbo Text To Video Create
    model: kling-3.0-turbo
    billing:
      enabled: true
    public:
      method: POST
      path: /kling/text-to-video/kling-3.0-turbo
    aliases:
      - method: POST
        path: /text-to-video/kling-3.0-turbo
    upstream:
      method: POST
      path: /text-to-video/kling-3.0-turbo
      headers: &kling_jwt_headers
        - name: Authorization
          value: Bearer {kling_jwt}
          transform: kling_jwt
    response: &kling_passthrough_response
      passthrough: true
  - id: turbo_image2video_create

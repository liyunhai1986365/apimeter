id: doubao-seedance-2
name: Doubao Seedance 2.0
media_type: video
accepted_modes:
  - openai.video.generations
upstream_modes:
  - volcengine.seedance.video
video:
  native:
    submit:
      method: POST
      path: /api/v3/contents/generations/tasks
      request:
        fields:
          - to: model
            from: body.model
          - to: omni_reference_task_type
            from: body.omni_reference_task_type
            omit_null: true
          - to: metadata.content
            from: body.content
            omit_empty: true
          - to: prompt
            from: body.content.#(type=="text").text
          - to: size
            from: body.resolution
            omit_empty: true
          - to: duration
            from: body.duration
            transform: to_int
            omit_empty: true
          - to: images
            from: body.content.#(type=="image_url")#.image_url.url
            omit_empty: true
          - to: metadata.video_url
            from: body.content.#(type=="video_url").video_url.url
            omit_empty: true
          - to: metadata.audio_url
            from: body.content.#(type=="audio_url").audio_url.url
            omit_empty: true
          - to: metadata.ratio
            from: body.ratio
            fallback_from: body.aspect_ratio
            omit_empty: true
          - to: metadata.watermark
            from: body.watermark
            omit_empty: true
          - to: metadata.generate_audio
            from: body.generate_audio
            omit_empty: true
      response:
        passthrough: true
        fields:
          - to: id
            from: public_task_id
        task_id_path: id
        status_path: status
    fetch:
      method: GET
      path: /api/v3/contents/generations/tasks/{task_id}
      response:
        passthrough: true
        fields:
          - to: id
            from: public_task_id
  billing:
    ratios:
      - key: seconds
        from: request.seconds
        fallback_from: request.duration
        transform: seedance_billing_duration
        default: 5
      - key: size
        value: 1
  submit:
    method: POST
    path: /api/v3/contents/generations/tasks
    body:
      fields:
        - to: model
          from: upstream_model
        - to: omni_reference_task_type
          from: request.omni_reference_task_type
          fallback_from: request.metadata.omni_reference_task_type
          omit_null: true
        - to: content
          from: request.metadata.content
          omit_empty: true
        - to: content
          from: request.prompt
          transform: seedance_text_content
          append: true
          omit_empty: true
          conditions:
            - field: request.metadata.content
              non_empty: false
        - to: content
          from: request.images
          transform: seedance_image_content
          append: true
          omit_empty: true
          conditions:
            - field: request.metadata.content
              non_empty: false
        - to: content
          from: request.metadata.video_url
          transform: seedance_video_content
          first_only: true
          append: true
          omit_empty: true
          conditions:
            - field: request.metadata.content
              non_empty: false
        - to: content
          from: request.metadata.audio_url
          transform: seedance_audio_content
          first_only: true
          append: true
          omit_empty: true
          conditions:
            - field: request.metadata.content
              non_empty: false
        - to: generate_audio
          from: request.metadata.generate_audio
          omit_empty: true
        - to: resolution
          from: request.size
          omit_empty: true
        - to: ratio
          from: request.metadata.ratio
          fallback_from: request.metadata.aspect_ratio
          omit_empty: true
        - to: duration
          from: request.seconds
          fallback_from: request.duration
          transform: to_int
          omit_empty: true
        - to: watermark
          from: request.metadata.watermark
          omit_empty: true
    response:
      task_id_path: id
      status_path: status
      status_map:
        queued: QUEUED
        pending: QUEUED
        submitted: SUBMITTED
        running: IN_PROGRESS
        in_progress: IN_PROGRESS
        processing: IN_PROGRESS
        succeeded: SUCCESS
        completed: SUCCESS
        success: SUCCESS
        failed: FAILURE
        error: FAILURE
        cancelled: FAILURE
  fetch:
    method: GET
    path: /api/v3/contents/generations/tasks/{task_id}
    response:
      task_id_path: id
      status_path: status
      result_url_path: content.video_url
      reason_path: error.message
      status_map:
        queued: QUEUED
        pending: QUEUED
        submitted: SUBMITTED
        running: IN_PROGRESS
        in_progress: IN_PROGRESS
        processing: IN_PROGRESS
        succeeded: SUCCESS
        completed: SUCCESS
        success: SUCCESS
        failed: FAILURE
        error: FAILURE
        cancelled: FAILURE
    openai_response:
      fields:
        - to: metadata.usage.completion_tokens
          from: usage.completion_tokens
          omit_empty: true
resources:
  - id: material_assets
    name: Material Assets
    public:
      method: POST
      path: /material/assets
    aliases:
      - method: POST
        path: /api/assets/upload
      - method: POST
        path: /api/assets
    upstream:
      method: POST
      path: /material/assets
    request:
      fields:
        - to: url
          from: body.url
        - to: asset_type
          from: body.asset_type
        - to: name
          from: body.name
          omit_empty: true
    response:
      fields:
        - to: code
          value: 0
        - to: message
          value: ok
        - to: data.Id
          from: data.Id
          fallback_from: id
          fallback_froms:
            - asset_id
  - id: material_assets_list
    name: Material Assets List
    public:
      method: GET
      path: /material/assets
    aliases:
      - method: GET
        path: /api/assets
    upstream:
      method: GET
      path: /material/assets
    request:
      fields:
        - to: page
          from: query.page
          omit_empty: true
        - to: page_size
          from: query.page_size
          omit_empty: true
        - to: name
          from: query.name
          omit_empty: true
        - to: statuses
          from: query.statuses
          omit_empty: true
        - to: sort_by
          from: query.sort_by
          omit_empty: true
        - to: sort_order
          from: query.sort_order
          omit_empty: true
    response:
      passthrough: true
  - id: material_asset_detail
    name: Material Asset Detail
    public:
      method: GET
      path: /material/assets/{asset_id}
    aliases:
      - method: GET
        path: /api/assets/{id}
    upstream:
      method: GET
      path: /material/assets/{asset_id}
    path_params:
      asset_id: id
    response:
      passthrough: true
  - id: material_asset_delete
    name: Material Asset Delete
    public:
      method: DELETE
      path: /material/assets/{asset_id}
    aliases:
      - method: DELETE
        path: /api/assets/{id}
    upstream:
      method: DELETE
      path: /material/assets/{asset_id}
    path_params:
      asset_id: id
    response:
      passthrough: true

id: seedance2-service-inference
name: Seedance2 Service Inference
media_type: video
accepted_modes:
  - openai.video.generations
upstream_modes:
  - service-inference.seedance2.video
video:
  native:
    submit:
      method: POST
      path: /api/v3/contents/generations/tasks
      response_format: openai_video
      request:
        fields:
          - to: model
            from: body.model
          - to: prompt
            from: body.content.#(type=="text").text
          - to: size
            from: body.resolution
            omit_empty: true
          - to: duration
            from: body.duration
            transform: to_int
            omit_empty: true
          - to: images
            from: body.content.#(type=="image_url")#.image_url.url
            omit_empty: true
          - to: metadata.video_url
            from: body.content.#(type=="video_url").video_url.url
            omit_empty: true
          - to: metadata.audio_url
            from: body.content.#(type=="audio_url").audio_url.url
            omit_empty: true
          - to: metadata.ratio
            from: body.ratio
            omit_empty: true
          - to: metadata.watermark
            from: body.watermark
            omit_empty: true
          - to: metadata.generate_audio
            from: body.generate_audio
            omit_empty: true
          - to: metadata.return_last_frame
            from: body.return_last_frame
            omit_empty: true
      response:
        passthrough: true
        fields:
          - to: task.id
            from: public_task_id
        task_id_path: task.id
        status_path: task.status
    fetch:
      method: GET
      path: /api/v3/contents/generations/tasks/{task_id}
      response_format: task_response
      response:
        passthrough: true
        fields:
          - to: task.id
            from: public_task_id
  billing:
    ratios:
      - key: seconds
        from: request.duration
        default: 4
      - key: size
        value: 1
  submit:
    method: POST
    path: /v1/video/generate
    body:
      fields:
        - to: model
          from: upstream_model
        - to: content
          from: request.prompt
          transform: seedance_text_content
          append: true
          omit_empty: true
        - to: content
          from: request.images
          transform: seedance_image_content
          append: true
          omit_empty: true
        - to: content
          from: request.metadata.video_url
          transform: seedance_video_content
          first_only: true
          append: true
          omit_empty: true
        - to: content
          from: request.metadata.audio_url
          transform: seedance_audio_content
          first_only: true
          append: true
          omit_empty: true
        - to: generate_audio
          from: request.metadata.generate_audio
          omit_empty: true
        - to: resolution
          from: request.size
          omit_empty: true
        - to: ratio
          from: request.metadata.ratio
          omit_empty: true
        - to: duration
          from: request.seconds
          fallback_from: request.duration
          transform: to_int
          omit_empty: true
        - to: watermark
          from: request.metadata.watermark
          omit_empty: true
        - to: return_last_frame
          from: request.metadata.return_last_frame
          omit_empty: true
    response:
      task_id_path: task.id
      status_path: task.status
      status_map:
        queued: QUEUED
        pending: QUEUED
        submitted: SUBMITTED
        running: IN_PROGRESS
        in_progress: IN_PROGRESS
        processing: IN_PROGRESS
        succeeded: SUCCESS
        completed: SUCCESS
        success: SUCCESS
        failed: FAILURE
        error: FAILURE
        cancelled: FAILURE
  fetch:
    method: GET
    path: /v1/video/tasks/{task_id}
    response:
      task_id_path: task.id
      status_path: task.status
      result_url_path: task.outputs.0
      reason_path: task.metadata.error.message
      total_tokens_path: task.usage.total_tokens
      completion_tokens_path: task.usage.completion_tokens
      status_map:
        queued: QUEUED
        pending: QUEUED
        submitted: SUBMITTED
        running: IN_PROGRESS
        in_progress: IN_PROGRESS
        processing: IN_PROGRESS
        succeeded: SUCCESS
        completed: SUCCESS
        success: SUCCESS
        failed: FAILURE
        error: FAILURE
        cancelled: FAILURE
    openai_response:
      fields:
        - to: video_url
          from: task.outputs.0
          omit_empty: true
        - to: metadata.url
          from: task.outputs.0
          omit_empty: true
        - to: metadata.usage.completion_tokens
          from: task.usage.completion_tokens
          omit_empty: true
        - to: metadata.usage.total_tokens
          from: task.usage.total_tokens
          omit_empty: true
        - to: metadata.last_frame_url
          from: task.last_frame_url
          omit_empty: true
resources:
  - id: asset_groups_create
    name: Asset Groups Create
    public:
      method: POST
      path: /v1/asset-groups
    upstream:
      method: POST
      path: /v1/asset-groups
    response:
      passthrough: true
  - id: asset_group_detail
    name: Asset Group Detail
    public:
      method: GET
      path: /v1/asset-groups/{group_id}
    upstream:
      method: GET
      path: /v1/asset-groups/{group_id}
    response:
      passthrough: true
  - id: assets_upload
    name: Assets Upload
    public:
      method: POST
      path: /api/assets/upload
    upstream:
      method: POST
      path: /v1/assets
    pre_requests:
      - id: asset_group
        skip_if_present: body.group_id
        managed_state:
          key: asset_group_id
          value_path: id
          validate:
            method: GET
            path: /v1/asset-groups/{group_id}
        upstream:
          method: POST
          path: /v1/asset-groups
        request:
          fields:
            - to: name
              value: jie222
            - to: description
              value: lifeng test
    request:
      fields:
        - to: group_id
          from: body.group_id
          fallback_from: pre.asset_group.id
        - to: url
          from: body.url
        - to: asset_type
          from: body.asset_type
        - to: name
          from: body.name
          omit_empty: true
    response:
      fields:
        - to: code
          value: 0
        - to: message
          value: ok
        - to: data.Id
          from: id
  - id: assets_create
    name: Assets Create
    public:
      method: POST
      path: /v1/assets
    aliases:
      - method: POST
        path: /api/assets
    upstream:
      method: POST
      path: /v1/assets
    pre_requests:
      - id: asset_group
        skip_if_present: body.group_id
        managed_state:
          key: asset_group_id
          value_path: id
          validate:
            method: GET
            path: /v1/asset-groups/{group_id}
        upstream:
          method: POST
          path: /v1/asset-groups
        request:
          fields:
            - to: name
              value: jie222
            - to: description
              value: lifeng test
    request:
      fields:
        - to: group_id
          from: body.group_id
          fallback_from: pre.asset_group.id
        - to: url
          from: body.url
        - to: asset_type
          from: body.asset_type
        - to: name
          from: body.name
          omit_empty: true
    response:
      passthrough: true
  - id: assets_get
    name: Assets Get
    public:
      method: POST
      path: /v1/assets/get
    upstream:
      method: POST
      path: /v1/assets/get
    aliases:
      - method: GET
        path: /api/assets/{id}
    request:
      fields:
        - to: asset_id
          from: body.asset_id
          fallback_from: path.id
        - to: task_id
          from: body.task_id
          fallback_from: query.task_id
          omit_empty: true
    response:
      fields:
        - to: code
          value: 0
        - to: message
          value: ok
        - to: data.AssetType
          from: asset_type
        - to: data.CreateTime
          from: created_at
        - to: data.GroupId
          from: group_id
        - to: data.Id
          from: id
        - to: data.Name
          from: name
        - to: data.ProjectName
          value: default
        - to: data.Status
          from: status
          value_map:
            completed: Active
            processing: Processing
            pending: Pending
            failed: Failed
            error: Failed
        - to: data.URL
          from: url
        - to: data.UpdateTime
          from: updated_at
